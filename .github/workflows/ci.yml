name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lovehold/shared build
      - run: pnpm --filter @lovehold/api exec prisma generate
      - run: pnpm --filter @lovehold/api exec tsc --noEmit
      - run: pnpm --filter @lovehold/web exec tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lovehold/api exec prisma generate
      - run: pnpm build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lovehold/shared build
      - run: pnpm --filter @lovehold/api exec prisma generate
      - run: pnpm --filter @lovehold/web exec vitest run
      - run: pnpm --filter @lovehold/api exec vitest run

  e2e:
    name: E2E (Playwright + Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # Solo Auth + Postgres: el resto de servicios de Supabase no se usa en la suite
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,supavisor,postgres-meta
      - name: Migrate local database
        working-directory: apps/api
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          DATABASE_URL="$DB_URL" DIRECT_URL="$DB_URL" pnpm exec prisma migrate deploy
      - run: pnpm --filter @lovehold/shared build
      - run: pnpm --filter @lovehold/api exec prisma generate
      - run: pnpm --filter @lovehold/api build
      - run: pnpm --filter @lovehold/web exec playwright install --with-deps chromium
      - run: pnpm --filter @lovehold/web e2e:build
      - run: pnpm --filter @lovehold/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
